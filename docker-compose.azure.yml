services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lightcurve
      POSTGRES_USER: lightcurve
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.azure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightcurve -d lightcurve"]
      interval: 10s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000
    volumes:
      - azurite_data:/data
    ports:
      - "10000:10000"

  azurite-init:
    image: mcr.microsoft.com/azure-cli:2.74.0
    depends_on:
      - azurite
    environment:
      AZURITE_CONNECTION_STRING: ${AZURITE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCD5H1L6JGzX9q7HNoOtsq9IyiGzlVJ65LyFP1sSsU9ZdU/VgUo2d0Q==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-lightcurve-audio}
    command: >
      sh -c "sleep 3 &&
      az storage container create
      --name $$AZURE_STORAGE_CONTAINER
      --connection-string $$AZURITE_CONNECTION_STRING
      --only-show-errors || true"

  speech:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    volumes:
      - hf_hub_cache:/home/ubuntu/.cache/huggingface/hub
    ports:
      - "8000:8000"

  mos:
    build:
      context: ./mos_service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - azurite-init
    environment:
      PORT: 8080
      MOS_SERVICE_TOKEN: ${MOS_SERVICE_TOKEN:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURITE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCD5H1L6JGzX9q7HNoOtsq9IyiGzlVJ65LyFP1sSsU9ZdU/VgUo2d0Q==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}

  embedding:
    build:
      context: ./embedding_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      EMBEDDING_MODEL: ${LIGHTCURVE_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_SERVICE_TOKEN: ${EMBEDDING_SERVICE_TOKEN:-}
    volumes:
      - hf_hub_cache:/root/.cache/huggingface/hub

  evaluate:
    build:
      context: ./modelorbit_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      MODELORBIT_SERVICE_TOKEN: ${MODELORBIT_SERVICE_TOKEN:-}

  voice-clone:
    build:
      context: ./voice_clone_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      VOICE_CLONE_SERVICE_TOKEN: ${VOICE_CLONE_SERVICE_TOKEN:-}
      VOICE_CLONE_DEVICE: ${VOICE_CLONE_DEVICE:-cpu}
    volumes:
      - hf_hub_cache:/root/.cache/huggingface/hub

  qwen:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: ["-hf", "Qwen/Qwen3-4B-GGUF:Q4_K_M", "--alias", "lightcurve-reasoner", "--host", "0.0.0.0", "--port", "8000", "--ctx-size", "8192", "--threads", "4", "--jinja"]
    volumes:
      - hf_hub_cache:/root/.cache/huggingface/hub

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite-init:
        condition: service_completed_successfully
      speech:
        condition: service_started
      mos:
        condition: service_started
      embedding:
        condition: service_started
      evaluate:
        condition: service_started
      voice-clone:
        condition: service_started
      qwen:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lightcurve:${POSTGRES_PASSWORD}@postgres:5432/lightcurve
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      LIGHTCURVE_LLM_PROVIDER: ${LIGHTCURVE_LLM_PROVIDER:-qwen}
      LIGHTCURVE_LLM_BASE_URL: ${LIGHTCURVE_LLM_BASE_URL:-http://qwen:8000}
      LIGHTCURVE_FLASH_JUDGE_MODEL: ${LIGHTCURVE_FLASH_JUDGE_MODEL:-lightcurve-reasoner}
      LIGHTCURVE_PRO_JUDGE_MODEL: ${LIGHTCURVE_PRO_JUDGE_MODEL:-lightcurve-reasoner}
      SPEECH_SERVICE_URL: http://speech:8000
      SPEECH_SERVICE_TOKEN: ${SPEECH_SERVICE_TOKEN:-}
      STT_MODEL: ${STT_MODEL:-distil-large-v3}
      STT_QUALITY_MODEL: ${STT_QUALITY_MODEL:-large-v3-turbo}
      TTS_MODEL: ${TTS_MODEL:-kokoro}
      TTS_FALLBACK_MODEL: ${TTS_FALLBACK_MODEL:-piper}
      TTS_VOICE: ${TTS_VOICE:-af_heart}
      EMBEDDING_SERVICE_URL: http://embedding:8080
      EMBEDDING_SERVICE_TOKEN: ${EMBEDDING_SERVICE_TOKEN:-}
      LIGHTCURVE_EMBEDDING_MODEL: ${LIGHTCURVE_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      MODELORBIT_SERVICE_URL: http://evaluate:8080
      MODELORBIT_SERVICE_TOKEN: ${MODELORBIT_SERVICE_TOKEN:-}
      VOICE_CLONE_SERVICE_URL: http://voice-clone:8080
      VOICE_CLONE_SERVICE_TOKEN: ${VOICE_CLONE_SERVICE_TOKEN:-}
      MOS_SERVICE_URL: http://mos:8080
      MOS_SERVICE_TOKEN: ${MOS_SERVICE_TOKEN:-}
      SCORING_INGEST_TOKEN: ${SCORING_INGEST_TOKEN:-}
      ADMIN_CREDITS_TOKEN: ${ADMIN_CREDITS_TOKEN:-}
      LIGHTCURVE_AUDIO_STORAGE: azure
      AZURE_STORAGE_CONNECTION_STRING: ${AZURITE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCD5H1L6JGzX9q7HNoOtsq9IyiGzlVJ65LyFP1sSsU9ZdU/VgUo2d0Q==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-lightcurve-audio}
      LIGHTCURVE_CREDENTIAL_SECRET: ${LIGHTCURVE_CREDENTIAL_SECRET}
      DODO_PAYMENTS_API_KEY: ${DODO_PAYMENTS_API_KEY:-}
      DODO_WEBHOOK_KEY: ${DODO_WEBHOOK_KEY:-}
      DODO_ENVIRONMENT: ${DODO_ENVIRONMENT:-test_mode}
      DODO_PRO_PRODUCT_ID: ${DODO_PRO_PRODUCT_ID:-}
      DODO_RETURN_URL: ${DODO_RETURN_URL:-}
      DODO_WEBHOOK_URL: ${DODO_WEBHOOK_URL:-}
      LIGHTCURVE_STUN_URL: ${LIGHTCURVE_STUN_URL:-stun:stun.l.google.com:19302}
      LIGHTCURVE_TURN_URL: ${LIGHTCURVE_TURN_URL:-}
      LIGHTCURVE_TURN_USERNAME: ${LIGHTCURVE_TURN_USERNAME:-}
      LIGHTCURVE_TURN_CREDENTIAL: ${LIGHTCURVE_TURN_CREDENTIAL:-}
      LIGHTCURVE_GATE_MIN_MOS: ${LIGHTCURVE_GATE_MIN_MOS:-3.8}
      LIGHTCURVE_GATE_MIN_TASK: ${LIGHTCURVE_GATE_MIN_TASK:-0.8}

  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lightcurve:${POSTGRES_PASSWORD}@postgres:5432/lightcurve
    command: sh -c "npm run db:push && npm run db:migrate"

volumes:
  postgres_data:
  azurite_data:
  hf_hub_cache:

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "use-lightcurve"
version = "0.5.0"
description = "Human-grounded end-to-end evaluation for Pipecat voice agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Lightcurve", email = "admin@uselightcurve.com" }
]
keywords = [
  "lightcurve",
  "voice-ai",
  "evals",
  "testing",
  "datasets",
  "pipecat"
]
dependencies = [
  "aiortc>=1.14,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://uselightcurve.com"
Dashboard = "https://app.uselightcurve.com"
Repository = "https://github.com/uselightcurve/Lightcurve-Platform"

[tool.hatch.build.targets.wheel]
packages = ["lightcurve"]

[tool.hatch.build.targets.sdist]
include = [
  "lightcurve",
  "README.md",
  "pyproject.toml",
]

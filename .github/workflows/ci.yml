name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint advisory
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Voice Graph compiler tests
        run: npm test

      - name: Compile Python SDK
        run: python -m compileall sdk/python/lightcurve

      - name: Build and install Python SDK
        run: |
          python -m pip install build
          python -m build sdk/python
          python -m pip install --force-reinstall --no-deps sdk/python/dist/use_lightcurve-0.5.1-py3-none-any.whl
          python -c "import lightcurve; assert lightcurve.__version__ == '0.5.1'"
